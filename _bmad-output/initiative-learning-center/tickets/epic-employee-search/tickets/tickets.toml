[[entry]]
id = 1
type = "story"
title = "Search approved learning information"
description = "Defines the versioned v1.LearningSearchResponseSchema in packages/contracts and lets an employee search approved catalog items and, when included in the MVP, personal learning records."
verify = "An employee searches Product Owner-approved English, Spanish, accented, mixed-language, punctuation, and filter examples and receives v1.LearningSearchResponseSchema. Each result is an approved LearningItemResponseSchema or EmployeeLearningRecordResponseSchema, appears once, and exposes approved type and source fields when available; authorization runs before count and pagination. All enabled result kinds use one FTS5 corpus; local results use default rank, then record kind BINARY order and internal ID, and expose neither a score nor a text snippet."
covers = ["R1", "R2"]
after = ["2.2", "2.3", "3.2", "1.2"]
hitl = true
risk = "medium"
refine = true
unknown = "Which catalog fields and filters are searchable, and which personal record types are in the MVP? If personal records are excluded, remove the dependency on ticket 2.3 and keep catalog-only results."

[[entry]]
id = 2
type = "story"
title = "Filter and open a search result"
description = "Lets an employee narrow results using approved available fields and open an authorized detail or source link."
verify = "A reviewer can apply and clear the agreed filters and reach a permitted detail without losing the search context."
covers = ["R2"]
after = [1]
hitl = true
risk = "medium"
refine = true
unknown = "Which filters and source links are approved for employees?"

[[entry]]
id = 3
type = "story"
title = "View personal learning records"
description = "Shows an authenticated employee the employee's own approved training and certification records."
verify = "The employee sees the agreed personal records and statuses; a second employee cannot see them."
covers = ["R2", "R3"]
after = [1, "2.3", "1.2"]
hitl = true
risk = "high"
refine = true
unknown = "Which completion, credential, validity, and expiration fields belong in the first release?"
