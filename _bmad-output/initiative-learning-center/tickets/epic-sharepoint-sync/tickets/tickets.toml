[[entry]]
id = 2
type = "story"
title = "Import approved SharePoint learning information"
description = "Imports approved library fields into the canonical LearningItem model created by ticket 5.7, retaining each source identifier and permitted link. Use the schema's unique source key and conflict-safe atomic upsert from the first import."
verify = "A source-owner-approved sample appears once in the shared LearningItem model with its source reference, expected fields, and per-record last_synced_at; repeating or overlapping the import updates that same item through the conflict-safe atomic upsert."
covers = ["R1"]
after = ["5.4", "5.3", "5.1", "5.7"]
hitl = true
risk = "high"
refine = true
unknown = "Does the source contain in-scope structured learning items and which automated permissions are approved?"

[[entry]]
id = 3
type = "story"
title = "Update imported records safely"
description = "Applies later source changes and withdrawals using the unique key and atomic upsert introduced by tickets 5.7 and 3.2, following the approved field-ownership policy."
verify = "Retries and overlapping runs use the existing unique-key upsert without uncontrolled duplicates or silent data loss; partial runs preserve last-good data, and a source withdrawal changes a record only when its approved authoritative signal and per-source rule permit it."
covers = ["R2", "R4"]
after = [2, "5.3"]
hitl = true
risk = "high"
refine = true
unknown = "How should source changes, withdrawals, and conflicts with manual edits be handled?"

[[entry]]
id = 4
type = "story"
title = "Show source synchronization health"
description = "Defines v1.SourceSyncHealthResponseSchema and GET /api/v1/admin/source-sync/status for every configured source, then lets administrators select a source and view its last-success time, current status, and actionable import errors."
verify = "An authorized administrator receives one status entry per configured source from the documented route, can select a source, distinguish a successful, stale, and failed run, and identify the next action. The response contains each source's latest attempt, last-success time, counts, and sanitized actionable errors without exposing source content or internal exception details; no configured sources returns an empty list."
covers = ["R3", "R4"]
after = [2]
hitl = true
risk = "medium"
refine = true
unknown = "What synchronization delay and recovery target should the pilot meet?"
