[[entry]]
id = 2
type = "story"
title = "Import approved SharePoint learning information"
description = "Imports approved library fields into the canonical LearningItem model created by ticket 5.7, retaining each source identifier and permitted link. Use the schema's unique source key and conflict-safe atomic upsert from the first import."
verify = "A source-owner-approved sample appears once in the shared LearningItem model with its source reference, expected fields, and per-record last_synced_at; repeating or overlapping the import updates that same item through the conflict-safe atomic upsert."
