[[entry]]
id = 6
type = "spike"
title = "Evaluate optional SharePoint change scanning for Brownbag recordings"
description = "After the append-only pilot import, assess whether automated metadata scans for changes, moves, or removals are useful and supportable. The pilot remains append-only with manual exception handling; this optional spike does not change or block ticket 3.2."
verify = "The Product Owner, SharePoint owner, and IT record available change/removal signals, identifier behavior, scan completeness and failure handling, and ACL enforcement; they decide to defer or create/update an implementation ticket without allowing partial scans to cause false withdrawals."
covers = ["R2", "R4"]
after = [2]
hitl = true
risk = "medium"
refine = true
unknown = "Can SharePoint provide reliable change/removal signals for this folder, and is automatic scanning worth adding after the pilot?"

[[entry]]
id = 3
type = "story"
title = "Update imported records safely"
description = "Optional follow-on after ticket 3.6: if an automated source-change scan is approved, applies later source changes and withdrawals using the unique key and atomic upsert introduced by tickets 5.7 and 3.2. Manual exception handling remains the pilot behavior."
verify = "Retries and overlapping runs use the existing unique-key upsert without uncontrolled duplicates or silent data loss; partial runs preserve last-good data, and a source withdrawal changes a record only when its approved authoritative signal and per-source rule permit it."
covers = ["R2", "R4"]
after = [2, "5.3", 6]
hitl = true
risk = "high"
refine = true
unknown = "How should source changes, withdrawals, and conflicts with manual edits be handled?"

[[entry]]
id = 4
type = "story"
title = "Show source synchronization health"
description = "Defines v1.SourceSyncHealthResponseSchema and GET /api/v1/admin/source-sync/status for every configured source, then lets administrators select a source and view its last-success time, current status, and actionable import errors."
verify = "An authorized administrator receives one status entry per configured source from the documented route, can select a source, distinguish a successful, stale, and failed run, and identify the next action. The response contains each source's latest attempt, last-success time, counts, and sanitized actionable errors without exposing source content or internal exception details; no configured sources returns an empty list."
covers = ["R3", "R4"]
after = [2]
hitl = true
risk = "medium"
refine = true
unknown = "What synchronization delay and recovery target should the pilot meet?"

